# Render Blueprint configuration for PhotoTrace AI
services:
  - type: web
    name: phototrace-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_REVERSE_GEOCODING
        value: "true"
      - key: MAX_CONTENT_LENGTH
        value: "33554432"
